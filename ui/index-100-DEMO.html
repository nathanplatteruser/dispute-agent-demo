<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Both Sides of the Letter — Dispute Response Pipeline</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3345;
  --text: #e4e6ef;
  --text-dim: #8b8fa3;
  --accent: #6c8cff;
  --green: #4caf86;
  --yellow: #e8b84a;
  --red: #e05555;
  --orange: #e0894a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 { font-size: 16px; font-weight: 600; }
.header .tier-badge {
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
}
.tier-api { background: #1a3a1a; color: var(--green); }
.tier-ollama { background: #1a2a3a; color: var(--accent); }
.tier-cache { background: #3a2a1a; color: var(--yellow); }
.tier-template { background: #2a2a2a; color: var(--text-dim); }

.stats-bar {
  display: flex;
  gap: 24px;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.stat { display: flex; gap: 6px; align-items: center; }
.stat-label { color: var(--text-dim); }
.stat-value { font-weight: 600; }

.main {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: calc(100vh - 100px);
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
}
.sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
  display: flex;
  justify-content: space-between;
}
.record-item {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s;
}
.record-item:hover { background: var(--surface2); }
.record-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
.record-item .account-id { font-weight: 600; color: var(--accent); }
.record-item .dispute-type { color: var(--text-dim); font-size: 11px; }
.record-item .risk-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
}
.risk-high { background: var(--red); }
.risk-medium { background: var(--yellow); }
.risk-low { background: var(--green); }

.content {
  display: grid;
  grid-template-rows: 1fr auto;
  overflow: hidden;
}
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
}

.panel {
  overflow-y: auto;
  padding: 20px;
  border-right: 1px solid var(--border);
}
.panel:last-child { border-right: none; }
.panel-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.narrative-text {
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--text);
}

.record-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 12px;
}
.meta-item { padding: 6px 10px; background: var(--surface2); border-radius: 4px; }
.meta-label { color: var(--text-dim); }
.meta-value { color: var(--text); font-weight: 500; }

.letter-text {
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  font-family: 'Georgia', serif;
  background: #fafaf5;
  color: #1a1a1a;
  padding: 24px;
  border-radius: 4px;
  border: 1px solid #ddd;
  position: relative;
}
.letter-text .annotation-highlight {
  background: rgba(224, 85, 85, 0.2);
  border-bottom: 2px solid var(--red);
  cursor: pointer;
  position: relative;
}

.bottom-panel {
  background: var(--surface);
  border-top: 1px solid var(--border);
  max-height: 300px;
  overflow-y: auto;
}

.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}
.tab {
  padding: 10px 20px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tab.active { color: var(--accent); border-color: var(--accent); }

.tab-content { display: none; padding: 16px 20px; }
.tab-content.active { display: block; }

.finding {
  padding: 8px 12px;
  margin-bottom: 8px;
  border-radius: 4px;
  font-size: 13px;
  border-left: 3px solid;
}
.finding-critical {
  background: rgba(224, 85, 85, 0.1);
  border-color: var(--red);
}
.finding-warning {
  background: rgba(232, 184, 74, 0.1);
  border-color: var(--yellow);
}
.finding .finding-type { font-weight: 600; text-transform: uppercase; font-size: 11px; }
.finding .finding-reason { color: var(--text-dim); margin-top: 2px; }

.annotation-item {
  padding: 10px 12px;
  margin-bottom: 8px;
  border-radius: 4px;
  background: var(--surface2);
  font-size: 13px;
}
.annotation-item .severity-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}
.severity-high { background: rgba(224, 85, 85, 0.2); color: var(--red); }
.severity-medium { background: rgba(232, 184, 74, 0.2); color: var(--yellow); }
.severity-low { background: rgba(76, 175, 134, 0.2); color: var(--green); }
.annotation-item .cfpb-quote {
  margin-top: 6px;
  padding: 6px 10px;
  background: var(--bg);
  border-radius: 3px;
  font-size: 12px;
  color: var(--text-dim);
  font-style: italic;
}

.intent-vs-impact {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px 0;
}
.intent-box, .impact-box {
  padding: 12px;
  border-radius: 4px;
  font-size: 13px;
}
.intent-box {
  background: rgba(76, 175, 134, 0.1);
  border: 1px solid rgba(76, 175, 134, 0.3);
}
.impact-box {
  background: rgba(224, 85, 85, 0.1);
  border: 1px solid rgba(224, 85, 85, 0.3);
}
.box-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: 600;
}
.intent-box .box-label { color: var(--green); }
.impact-box .box-label { color: var(--red); }

.filter-bar {
  display: flex;
  gap: 8px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
}
.filter-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(108, 140, 255, 0.1); }

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 14px;
  text-align: center;
  padding: 40px;
}

.consumer-envelope {
  max-width: 600px;
  margin: 0 auto;
  background: white;
  border: 1px solid #ccc;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
  padding: 40px;
}

/* Inline highlights in letter body */
.annot-highlight {
  border-radius: 2px;
  padding: 1px 2px;
  cursor: pointer;
  transition: filter 0.15s;
}
.annot-highlight:hover { filter: brightness(0.85); }
.annot-high { background: rgba(224, 85, 85, 0.25); border-bottom: 2px solid #e05555; }
.annot-medium { background: rgba(232, 184, 74, 0.25); border-bottom: 2px solid #e8b84a; }
.annot-low { background: rgba(76, 175, 134, 0.25); border-bottom: 2px solid #4caf86; }
.review-highlight {
  border-radius: 2px;
  padding: 1px 2px;
  cursor: pointer;
  transition: filter 0.15s;
}
.review-highlight:hover { filter: brightness(0.85); }
.review-critical { background: rgba(180, 40, 40, 0.2); border-bottom: 2px dashed #b42828; }
.review-warning { background: rgba(200, 150, 30, 0.2); border-bottom: 2px dashed #c8961e; }

/* Scroll-target flash */
.finding-flash, .annotation-flash {
  animation: flashHighlight 1.5s ease;
}
@keyframes flashHighlight {
  0% { box-shadow: 0 0 0 3px var(--accent); }
  100% { box-shadow: none; }
}

s showing the transfer of the debt from the original creditor to the current creditor.\n\n4. Proof that the original creditor securitized the debt.\n\n5. Documentation showing the assignments of the debt from the original creditor to the secured trust and then back to the original creditor. \nPlease cease and desist from collecting on this debt until you have provided validation of the debt. \nAdditionally, I request that you do not access my credit report or report anything to my credit bureaus. I dispute the validity of this debt amount, and this dispute should be reflected on my credit report if you have already reported this debt. \nPermissible Purpose Please state your permissible purpose for accessing my credit information. I dispute your right to do so.\n\nNotification to Other Collectors I dispute that I owe this debt to you. Should you transfer this debt to another collector, please inform them of my dispute regarding the validity of this debt. \nThank you for your prompt attention to this matter.", "complaint_id": "10692842", "cfpb_product": "Debt collection", "cfpb_issue": "False statements or representation", "cfpb_sub_issue": "Attempted to collect wrong amount", "cfpb_company_response": "Closed with non-monetary relief", "classified_type": "validation_request", "classification_method": "keywords", "classification_confidence": 1.0, "draft_letter": "April 4, 2026\n\nDaniel Torres\n330 Spruce Circle\nSpringfield, SC 62701\n\nRE: Account reference: ACC-819796\n\nDear Mr. Torres,\n\nRe: Account reference: ACC-819796\n\nWe acknowledge receipt of your dispute letter dated [not provided] regarding the above-referenced account. You have requested that we provide documentation confirming the debt and verify that we have contacted the correct individual.\n\nWe understand your request and are happy to provide the necessary information. The original creditor for this account is Summit Trust Bank. The current balance on the account is $2,022.05. We have investigated e": "2022-02-11", "last_payment_date": "2023-10-22", "last_payment_amount": "436.1", "state": "VT", "dispute_type": "not_mine", "validation_requested": "False", "prior_contacts": "3", "contact_log": "2022-04-26;2023-02-01;2023-05-07", "has_contradiction": "False", "narrative": "I noticed that this company had placed an account on my XXXX credit report on XX/XX/2023. I am subscribed to XXXXXXXX XXXX Credit monitoring service, and I was notified that there was a new alert. This account was placed on my report on XX/XX/2023. This is the first time that I had heard of this company and was notified of this debt. I immediately called the number listed on my credit report and I spoke with XXXX. She says that they had sent out a letter to my permanent residence on XX/XX/XXXX, XXXX which was not true. Although I am living in another city while working, I am constantly monitoring my mail at my permanent residence, and I collect my mail one to two days out of the week when I return home. I never received this mail. \nI am working to improve my credit score after facing some difficulties due to the pandemic, If there was ANY type of communication sent to me regarding a bill, I would have responded. This company did not notify me. I sent them a letter stating that they did not notify me, as required by the Fair Debt Collection Practices Act and I asked them to delete this account from my report. I also disputed this account with XXXX, but Vance and Huffman continue to report this account. This is my last resort. If this account is not removed, then I will be forced to seek civil action. This one account dropped my credit score XXXX XXXX. I will not allow this company to affect my credit score to this point, while not following proper procedures as required by the Fair Debt Collection Practices Act.", "complaint_id": "6999410", "cfpb_product": "Debt collection", "cfpb_issue": "Written notification about debt", "cfpb_sub_issue": "Didn't receive notice of right to dispute", "cfpb_c sted": "False", "prior_contacts": "2", "contact_log": "2022-07-27;2022-08-01", "has_contradiction": "False", "narrative": "I am writing to formally dispute and request the removal of inaccurate information on my credit report pertaining to late payments. I insist that these accounts be updated to accurately reflect the payments made and that any negative information be rectified accordingly. \n\nThe late payments in question are as follows : 1. Creditor Name : XXXX  Account Number : XXXX Date Opened : XX/XX/XXXX Balance : XXXX Inaccuracy : XXXX XXXX XXXX XXXX I want to bring to your attention that the payments for the mentioned accounts were made in a timely manner, and there is no basis for the reported late payments. I request that you investigate and update the information to accurately reflect that the payments were made on time. \nFurthermore, there is no remaining balance on these accounts that would suggest a missed payment. I have diligently met my financial obligations, and it is crucial that my credit report reflects this accurately. The inaccurate reporting of late payments is not only misleading but also damaging to my creditworthiness.", "complaint_id": "8141160", "cfpb_product": "Debt collection", "cfpb_issue": "Written notification about debt", "cfpb_sub_issue": "Didn't receive enough information to verify debt", "cfpb_company_response": "Closed with explanation", "classified_type": "validation_request", "classification_method": "ledger", "classification_confidence": 0.5, "draft_letter": "January 13, 2026\n\nTina Moore\n2240 Birch Street\nSpringfield, NE 62701\n\nRE: Account reference: ACC-274446\n\nDear Ms. Moore,\n\nRe: Account reference: ACC-274446\n\nWe acknowledge receipt of your dispute letter regarding the account referenced above. We understand that you are disputing the accuracy of the late payments reported on your credit report. We take all disputes seriously and are committed to ensuring the accuracy of the information we report.\n\nPursua  Inc.\n\ncc: File\n\nNote: The letter is under 400 words and only includes facts from the provided record.", "annotations": [{"id": "buried_rights", "matched_text": "You have the right", "position": 1490, "flag": "Consumer rights buried in dense paragraph \u2014 should be prominent, not embedded", "cfpb_grounding": "Consumers report: 'I didn't know I could dispute it \u2014 I found out later I had rights'", "severity": "medium"}], "risk_score": 2, "risk_level": "low", "intent": "We want to work with you on a payment arrangement you can manage.", "impact": ["'I didn't know I could dispute this' \u2014 consumer doesn't exercise rights"], "account_id": "ACC-501126", "dispute_type": "hardship"}}, {"account_id": "ACC-563187", "consumer_name": "Zachary Burke", "original_creditor": "Horizon Card Co", "current_servicer": "Keystone Account Solutions", "balance_original": 17319.78, "balance_current": 7912.3, "charge_off_date": "2021-09-10", "last_payment_date": "2023-02-27", "last_payment_amount": "428.13", "state": "CT", "dispute_type": "not_mine", "validation_requested": "False", "prior_contacts": "5", "contact_log": "2021-11-01;2022-08-08;2022-08-08;2023-05-21;2023-09-26", "has_contradiction": "False", "narrative": "I was contacted by phone by a representative of Joseph , Mann & Creed about a debt to a company called XXXX for payment of a motorcycle monthly bill of XXXX. My bank was referenced as the connection to the debt. I told the representative that I will call my bank and call them back. I spoke to a rep from my bank that owns has the lean on the motorcycle and they assured me that the account was in good standing just as the bank website is reporting.", "complaint_id": "7074881", "cfpb_product": "Debt collection", "cfpb_issue": "False statements or representation", "cfpb_sub_issue": "Attempted to collect wrong amount", "cfpb_company_response": "Closed with non-monetary relief", "classified_type": "not_mine", "classification_method": "ledger", "classification_confide ract. I advised that I want Integrated Mediation Solutions LLC to provide me with a copy of it so that I know they have legal jurisdiction to collect this debt. The agent/supervisor continued to try talking me out of this, and stated they would no longer be able to settle later on if I requested proof of the debt today. She stated that I was refusing to pay the debt, and I corrected her by saying I only asked for proof. I ended the call by asking for proof of the debt be provided to me. This lender violated the FCDPA by misrepresenting that they had filed a lawsuit and obtained a judgment already. They tried using scare tactics that were unethical because I wanted proof of the debt as Im authorized under law. Lastly, the original lender is not licensed in the state where the loan was obtained, and loan principal has already been paid in full. The original lender utilized an ongoing tactic of renewing the loan weekly so that it could never be paid back. Lastly Integrated Mediation Solutions misrepresented themselves multiple tim...", "complaint_id": "2994337", "cfpb_product": "Debt collection", "cfpb_issue": "False statements or representation", "cfpb_sub_issue": "Impersonated attorney, law enforcement, or government official", "cfpb_company_response": "Closed with explanation", "classified_type": "identity_theft", "classification_method": "ledger", "classification_confidence": 0.5, "draft_letter": "December 4, 2026\n\nMiles Bell\n4422 Pine Bluff Way\nSpringfield, NM 62701\n\nRE: Account reference: ACC-967611\n\nDear Mr. Bell,\n\nRe: Account reference: ACC-967611\n\nWe acknowledge receipt of your dispute regarding the account referenced above. We understand that you have raised concerns about the identity of the original creditor and the collection activities associated with this account.\n\nWe want to assure you that we take all disputes seriously and will investigate the matter accordingly. As per the Fair Debt Collection Practices Act (FDCPA), we are required to v <body>

<div class="header">
  <h1>Both Sides of the Letter</h1>
  <div>
    <span id="tier-badge" class="tier-badge tier-template">TEMPLATE</span>
    <span style="color: var(--text-dim); font-size: 12px; margin-left: 12px;" id="record-count">0 records</span>
  </div>
</div>

<div class="stats-bar" id="stats-bar">
  <div class="stat"><span class="stat-label">Processed:</span> <span class="stat-value" id="stat-processed">-</span></div>
  <div class="stat"><span class="stat-label">Drafted:</span> <span class="stat-value" id="stat-drafted">-</span></div>
  <div class="stat"><span class="stat-label">Passed Review:</span> <span class="stat-value" id="stat-passed" style="color: var(--green)">-</span></div>
  <div class="stat"><span class="stat-label">Flagged:</span> <span class="stat-value" id="stat-flagged" style="color: var(--red)">-</span></div>
  <div class="stat"><span class="stat-label">High Risk:</span> <span class="stat-value" id="stat-highrisk" style="color: var(--orange)">-</span></div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Records</span>
      <span id="filter-label">All</span>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="flagged">Flagged</button>
      <button class="filter-btn" data-filter="high">High Risk</button>
      <button class="filter-btn" data-filter="passed">Passed</button>
    </div>
    <div id="record-list"></div>
  </div>

  <div class="content">
    <div class="panels" id="panels">
      <div class="panel" id="source-panel">
        <div class="empty-state">Select a record from the sidebar to view details</div>
      </div>
      <div class="panel" id="letter-panel">
        <div class="empty-state">The generated letter will appear here</div>
      </div>
    </div>

    <div class="bottom-panel" id="bottom-panel" style="display: none;">
      <div class="tab-bar">
        <div class="tab active" data-tab="review">Review Gate</div>
        <div class="tab" data-tab="consumer">Consumer Impact</div>
        <div class="tab" data-tab="intent">Intent vs Impact</div>
        <div class="tab" data-tab="validation">Validation Log</div>
      </div>
      <div class="tab-content active" id="tab-review"></div>
      <div class="tab-content" id="tab-consumer"></div>
      <div class="tab-content" id="tab-intent"></div>
      <div class="tab-content" id="tab-validation"></div>
    </div>
  </div>
</div>

<script>
let DATA = [];
let SUMMARY = {};
let currentFilter = 'all';
let currentRecord = null;

async function loadData() {
  // Prefer inlined data (written by run.py into index.html)
  if (window.__PIPELINE_RECORDS && window.__PIPELINE_RECORDS.length > 0) {
    DATA = window.__PIPELINE_RECORDS;
    SUMMARY = window.__PIPELINE_SUMMARY || {};
    updateStats();
    renderList();
    if (DATA.length > 0) selectRecord(0);
    return;
  }
  // Fallback: try fetch (works when served via HTTP, fails on file://)
  try {
    const [recordsResp, summaryResp] = await Promise.all([
      fetch('../output/records.json'),
      fetch('../output/summary.json')
    ]);
    DATA = await recordsResp.json();
    SUMMARY = await summaryResp.json();
    updateStats();
    renderList();
    if (DATA.length > 0) selectRecord(0);
  } catch (e) {
    document.getElementById('record-list').innerHTML =
      '<div class="empty-state">No data found. Run: python3 run.py</div>';
  }
}

function updateStats() {
  document.getElementById('stat-processed').textContent = SUMMARY.total_records || DATA.length;
  document.getElementById('stat-drafted').textContent = SUMMARY.drafted || '-';
  document.getElementById('stat-passed').textContent = SUMMARY.review_passed || '-';
  document.getElementById('stat-flagged').textContent = SUMMARY.review_flagged || '-';
  document.getElementById('stat-highrisk').textContent = SUMMARY.high_risk_letters || '-';
  document.getElementById('record-count').textContent = DATA.length + ' records';

  // Set tier badge
  const tiers = DATA.map(r => r.draft_tier).filter(Boolean);
  const tierSet = new Set(tiers);
  const badge = document.getElementById('tier-badge');
  if (tierSet.has('api')) { badge.textContent = 'CLOUD API'; badge.className = 'tier-badge tier-api'; }
  else if (tierSet.has('ollama')) { badge.textContent = 'LOCAL MODEL'; badge.className = 'tier-badge tier-ollama'; }
  else if (tierSet.has('cache')) { badge.textContent = 'CACHED'; badge.className = 'tier-badge tier-cache'; }
  else { badge.textContent = 'TEMPLATE'; badge.className = 'tier-badge tier-template'; }
}

function getFilteredData() {
  switch (currentFilter) {
    case 'flagged': return DATA.filter(r => !r.review_passed);
    case 'high': return DATA.filter(r => r.engagement_risk_level === 'high');
    case 'passed': return DATA.filter(r => r.review_passed);
    default: return DATA;
  }
}

function renderList() {
  const filtered = getFilteredData();
  const list = document.getElementById('record-list');
  list.innerHTML = filtered.map((rec, i) => {
    const globalIdx = DATA.indexOf(rec);
    const risk = rec.engagement_risk_level || 'low';
    const reviewIcon = rec.review_passed === false ? ' !' : '';
    return `<div class="record-item" data-idx="${globalIdx}" onclick="selectRecord(${globalIdx})">
      <span class="risk-dot risk-${risk}"></span>
      <span class="account-id">${rec.account_id || '?'}</span>${reviewIcon}
      <div class="dispute-type">${rec.classified_type || rec.dispute_type || '?'} &middot; $${formatBalance(rec.balance_current)}</div>
    </div>`;
  }).join('');
  document.getElementById('filter-label').textContent =
    currentFilter === 'all' ? `All (${filtered.length})` : `${currentFilter} (${filtered.length})`;
}

function formatBalance(val) {
  if (val === undefined || val === null) return '?';
  const num = typeof val === 'string' ? parseFloat(val.replace(/[$,]/g, '')) : val;
  if (isNaN(num)) return val;
  return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function selectRecord(idx) {
  currentRecord = DATA[idx];
  const rec = currentRecord;

  // Highlight sidebar
  document.querySelectorAll('.record-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
  });

  // Source panel
  const sp = document.getElementById('source-panel');
  sp.innerHTML = `
    <div class="panel-title">Source Record</div>
    <div class="record-meta">
      <div class="meta-item"><div class="meta-label">Account</div><div class="meta-value">${rec.account_id || '?'}</div></div>
      <div class="meta-item"><div class="meta-label">Creditor</div><div class="meta-value">${rec.original_creditor || '?'}</div></div>
      <div class="meta-item"><div class="meta-label">Balance</div><div class="meta-value">$${formatBalance(rec.balance_current)}</div></div>
      <div class="meta-item"><div class="meta-label">Original</div><div class="meta-value">$${formatBalance(rec.balance_original)}</div></div>
      <div class="meta-item"><div class="meta-label">State</div><div class="meta-value">${rec.state || '?'}</div></div>
      <div class="meta-item"><div class="meta-label">Type</div><div class="meta-value">${rec.classified_type || rec.dispute_type || '?'}</div></div>
      <div class="meta-item"><div class="meta-label">Charge-off</div><div class="meta-value">${rec.charge_off_date || '?'}</div></div>
      <div class="meta-item"><div class="meta-label">Last Payment</div><div class="meta-value">${rec.last_payment_date || 'None'}</div></div>
    </div>
    <div class="panel-title" style="margin-top: 16px;">Consumer Narrative</div>
    <div class="narrative-text">${escapeHtml(rec.narrative || 'No narrative')}</div>
  `;

  // Letter panel — highlight consumer-impact annotations and review findings inline
  const lp = document.getElementById('letter-panel');
  const letter = rec.draft_letter || 'No letter drafted';
  const tier = rec.draft_tier || '?';
  const annotations = rec.consumer_annotations || [];
  const reviewFindings = (rec.review_findings || []).filter(f => f.claim_value);

  // Build highlight markers from both annotation and review sources
  let markers = [];
  annotations.forEach((a, i) => {
    markers.push({
      text: a.matched_text,
      cls: 'annot-highlight annot-' + a.severity,
      id: 'annot-' + i,
      tooltip: a.flag,
      source: 'consumer'
    });
  });
  reviewFindings.forEach((f, i) => {
    markers.push({
      text: f.claim_value,
      cls: 'review-highlight review-' + f.severity,
      id: 'review-' + i,
      tooltip: f.reason,
      source: 'review'
    });
  });

  // Apply highlights to escaped letter text
  let annotatedLetter = escapeHtml(letter);
  // Sort by length descending to avoid partial matches clobbering longer ones
  markers.sort((a, b) => b.text.length - a.text.length);
  markers.forEach(m => {
    const escaped = escapeHtml(m.text);
    if (escaped && annotatedLetter.includes(escaped)) {
      annotatedLetter = annotatedLetter.replace(
        escaped,
        `<span class="${m.cls}" data-id="${m.id}" title="${escapeHtml(m.tooltip)}">${escaped}</span>`
      );
    }
  });

  lp.innerHTML = `
    <div class="panel-title">Generated Letter <span style="float: right; font-size: 11px; color: var(--text-dim)">Tier: ${tier}</span></div>
    <div class="consumer-envelope">
      <div class="letter-text">${annotatedLetter}</div>
    </div>
  `;

  // Click-to-scroll: clicking a highlight scrolls to its flag in the bottom panel
  lp.querySelectorAll('[data-id]').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const tabName = id.startsWith('annot-') ? 'consumer' : 'review';
      // Switch to the right tab
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
      // Scroll to the finding
      const target = document.getElementById(id);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  // Bottom panel
  document.getElementById('bottom-panel').style.display = 'block';
  renderReviewTab(rec);
  renderConsumerTab(rec);
  renderIntentTab(rec);
  renderValidationTab(rec);
}

function renderReviewTab(rec) {
  const findings = rec.review_findings || [];
  const tab = document.getElementById('tab-review');
  if (findings.length === 0) {
    tab.innerHTML = '<div style="padding: 12px; color: var(--green);">No findings — letter passed review gate.</div>';
    return;
  }
  tab.innerHTML = findings.map((f, i) => `
    <div class="finding finding-${f.severity}" id="review-${i}">
      <div class="finding-type">${f.severity}: ${f.claim_type}</div>
      <div>${escapeHtml(f.claim_value || '')}</div>
      <div class="finding-reason">${escapeHtml(f.reason)}</div>
    </div>
  `).join('');
}

function renderConsumerTab(rec) {
  const annotations = rec.consumer_annotations || [];
  const tab = document.getElementById('tab-consumer');
  if (annotations.length === 0) {
    tab.innerHTML = '<div style="padding: 12px; color: var(--green);">No disengagement patterns detected.</div>';
    return;
  }
  const risk = rec.engagement_risk_level || 'low';
  const score = rec.engagement_risk_score || 0;
  tab.innerHTML = `
    <div style="padding: 8px 0 12px; font-size: 13px;">
      Engagement Risk: <span class="severity-badge severity-${risk}">${risk.toUpperCase()} (${score})</span>
    </div>
    ${annotations.map((a, i) => `
      <div class="annotation-item" id="annot-${i}">
        <span class="severity-badge severity-${a.severity}">${a.severity}</span>
        <strong style="margin-left: 8px;">${escapeHtml(a.matched_text)}</strong>
        <div style="margin-top: 4px;">${escapeHtml(a.flag)}</div>
        <div class="cfpb-quote">${escapeHtml(a.cfpb_grounding)}</div>
      </div>
    `).join('')}
  `;
}

function renderIntentTab(rec) {
  const tab = document.getElementById('tab-intent');
  const intent = rec.agency_intent || '';
  const impacts = rec.consumer_impact || [];
  tab.innerHTML = `
    <div class="intent-vs-impact">
      <div class="intent-box">
        <div class="box-label">What the agency intended</div>
        ${escapeHtml(intent)}
      </div>
      <div class="impact-box">
        <div class="box-label">What the consumer hears</div>
        ${impacts.length > 0 ? impacts.map(i => `<div style="margin-bottom: 6px;">${escapeHtml(i)}</div>`).join('') : '<div style="color: var(--green);">Letter communicates intent clearly</div>'}
      </div>
    </div>
  `;
}

function renderValidationTab(rec) {
  const tab = document.getElementById('tab-validation');
  const balance = rec.balance_current;
  const isString = typeof balance === 'string' && (balance.includes('$') || balance.includes(','));
  tab.innerHTML = `
    <div style="padding: 12px;">
      <div style="margin-bottom: 8px;"><strong>Balance value:</strong> <code>${escapeHtml(String(balance))}</code> ${isString ? '<span style="color: var(--red); font-weight: 600;"> STRING</span>' : '<span style="color: var(--green);"> NUMERIC</span>'}</div>
      <div style="margin-bottom: 8px;"><strong>Classification:</strong> ${rec.classified_type || '?'} (${rec.classification_method || '?'}, confidence: ${rec.classification_confidence || '?'})</div>
      <div style="margin-bottom: 8px;"><strong>Review passed:</strong> ${rec.review_passed ? '<span style="color: var(--green);">YES</span>' : '<span style="color: var(--red);">NO</span>'}</div>
      <div><strong>Draft tier:</strong> ${rec.draft_tier || '?'}</div>
    </div>
  `;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (!currentRecord) return;
  const idx = DATA.indexOf(currentRecord);
  if (e.key === 'ArrowDown' && idx < DATA.length - 1) { selectRecord(idx + 1); e.preventDefault(); }
  if (e.key === 'ArrowUp' && idx > 0) { selectRecord(idx - 1); e.preventDefault(); }
});

// Load data on page open
loadData();
</script>
</body>
</html>
