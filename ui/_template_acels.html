<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Both Sides of the Letter — Review Timeline</title>
<style>
:root{
  --paper:#FBFAF7; --panel:#FFFFFF; --sunk:#F3F1EC;
  --ink:#1C1A17; --muted:#6E675C; --faint:#9A9285;
  --rule:#DED8CE; --rule-soft:#EBE7DF;
  --oxblood:#8C2F1E; --oxblood-bg:#FAF0ED;
  --verified:#3F6B4A; --verified-bg:#EFF4EF;
  --amber:#9A6B14; --amber-bg:#FAF4E6;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.6;font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.masthead{border-bottom:1px solid var(--rule);padding:22px 32px 0}
.masthead h1{font-size:23px;font-weight:600;letter-spacing:-.01em}
.masthead .sub{color:var(--muted);font-size:14.5px;margin-top:3px}
.caption{display:flex;flex-wrap:wrap;margin:20px 0 0;border-top:1px solid var(--rule-soft)}
.cap{padding:12px 26px 12px 0;margin-right:26px;border-right:1px solid var(--rule-soft);background:none;border-top:0;border-left:0;border-bottom:0;text-align:left;font:inherit;color:inherit}
.cap[data-f]{cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.cap[data-f]:hover .n{text-decoration:underline;text-underline-offset:4px}
.cap[data-f].sel{border-bottom-color:var(--oxblood)}
.cap[data-f]:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}
.cap.split{border-left:1px solid var(--rule);padding-left:26px}
.reconcile{font-size:12.5px;color:var(--muted);padding:0 0 14px;line-height:1.5;max-width:760px}
.reconcile b{color:var(--ink);font-weight:600}
.axis{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px}
.cap:last-child{border-right:0}
.cap .n{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;display:block}
.cap .l{font-size:12.5px;color:var(--muted)}
.cap.flag .n{color:var(--oxblood)}
.cap.ok .n{color:var(--verified)}

.spread{display:flex;height:calc(100vh - 152px);min-height:520px}
.docket{width:340px;flex:none;border-right:1px solid var(--rule);overflow-y:auto;background:var(--sunk)}
.docket-head{position:sticky;top:0;background:var(--sunk);border-bottom:1px solid var(--rule);padding:14px 18px 10px;z-index:2}
.docket-head .count{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.f{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:2px}
.f:hover{border-color:var(--faint)}
.f.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.f:focus-visible{outline:2px solid var(--oxblood);outline-offset:1px}

.rec{padding:13px 18px;border-bottom:1px solid var(--rule-soft);cursor:pointer;border-left:3px solid transparent}
.rec:hover{background:#EEEBE4}
.rec.on{background:var(--panel);border-left-color:var(--oxblood)}
.rec:focus-visible{outline:2px solid var(--oxblood);outline-offset:-2px}
.rec .id{font-family:var(--mono);font-size:12.5px;font-weight:600}
.rec .who{font-size:14.5px;margin-top:1px}
.rec .tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.t{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:2px;text-transform:uppercase}
.t.pass{background:var(--verified-bg);color:var(--verified)}
.t.flagd{background:var(--amber-bg);color:var(--amber)}
.t.ref{background:var(--oxblood);color:#fff}
.t.risk{background:var(--sunk);color:var(--muted);border:1px solid var(--rule)}

.read{flex:1;overflow-y:auto;background:var(--panel)}
.tabs{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--rule);display:flex;padding:0 32px;z-index:2}
.tb{font-family:var(--serif);font-size:15px;padding:15px 0;margin-right:28px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer}
.tb:hover{color:var(--ink)}
.tb.on{color:var(--ink);border-bottom-color:var(--oxblood)}
.tb:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}
.pane{display:none;padding:28px 32px 60px;max-width:820px}
.pane.on{display:block}

.hd{font-size:12.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:30px 0 10px}
.hd.first{margin-top:0}

.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--rule)}
.ld{padding:11px 14px;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}
.ld .k{font-size:12px;color:var(--muted)}
.ld .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:2px}

.letter{background:var(--paper);border:1px solid var(--rule);padding:30px 34px;font-size:16.5px;line-height:1.78;white-space:pre-wrap}
.letter mark{background:var(--oxblood-bg);color:var(--oxblood);font-weight:600;padding:1px 3px;box-shadow:inset 0 -1px 0 var(--oxblood)}

.flagnote{border-left:3px solid var(--oxblood);background:var(--oxblood-bg);padding:14px 18px;margin:14px 0}
.flagnote .why{font-size:15.5px}
.flagnote .meta{font-family:var(--mono);font-size:12px;color:var(--oxblood);margin-top:7px}

.verdict{border:1px solid var(--rule);padding:16px 20px;margin:18px 0}
.verdict.refused{border-color:var(--oxblood);background:var(--oxblood-bg)}
.verdict.passed{border-color:var(--verified);background:var(--verified-bg)}
.verdict .big{font-size:17px;font-weight:600}
.verdict.refused .big{color:var(--oxblood)}
.verdict.passed .big{color:var(--verified)}
.verdict .fine{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55}

blockquote.quote{border-left:2px solid var(--rule);padding-left:18px;color:#3B372F;font-size:16px;line-height:1.72}
.two{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule)}
.two > div{padding:16px 18px}
.two > div:first-child{border-right:1px solid var(--rule-soft)}
.two .k{font-size:12.5px;color:var(--muted);margin-bottom:6px}
ul.notes{list-style:none}
ul.notes li{padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:15px}
ul.notes li:before{content:"—";color:var(--faint);margin-right:9px}
.dl{font-family:var(--mono);font-size:13.5px}
.dl div{padding:7px 0;border-bottom:1px solid var(--rule-soft);display:flex;justify-content:space-between;gap:20px}
.dl span:first-child{color:var(--muted)}
.none{color:var(--faint);font-style:italic;padding:26px 0}

/* segmented pill group, after Spotify for Creators */
.filters{display:inline-flex;gap:0;background:#E9E5DD;border-radius:999px;padding:3px;flex-wrap:wrap}
.f{border:0;border-radius:999px;padding:6px 13px;font-family:var(--serif);font-size:13px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.f.on{background:var(--ink);color:var(--paper);font-weight:600}
.f:hover:not(.on){color:var(--ink)}

/* diff gutters, after GitHub code review */
.diff{border:1px solid var(--rule);border-radius:4px;overflow:hidden;font-family:var(--mono);font-size:12.5px;line-height:1.75}
.diff .row{display:flex;border-bottom:1px solid #F0EDE6}
.diff .row:last-child{border-bottom:0}
.diff .gut{flex:none;width:30px;text-align:center;color:var(--faint);background:#F6F4EF;border-right:1px solid var(--rule-soft);user-select:none;font-size:11px;padding-top:2px}
.diff .txt{padding:3px 12px;white-space:pre-wrap;flex:1}
.diff .del{background:#FCEFEC}
.diff .del .gut{background:#F8E2DD;color:var(--oxblood)}
.diff .add{background:#EDF5EF}
.diff .add .gut{background:#DFEDE3;color:var(--verified)}
.suggest{border:1px solid var(--rule);border-radius:4px;margin:16px 0;overflow:hidden}
.suggest .cap{background:var(--sunk);padding:9px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--rule)}

/* vertical timeline, after Airwallex approvals */
.tl{margin:20px 0 0;padding-left:26px;position:relative}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:34px;width:2px;background:var(--rule)}
.tl .ev{position:relative;padding-bottom:24px}
.tl .ev:before{content:"";position:absolute;left:-26px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--rule)}
.tl .ev.done:before{background:var(--verified);border-color:var(--verified)}
.tl .ev.stop:before{background:var(--oxblood);border-color:var(--oxblood)}
.tl .ev.now:before{background:var(--paper);border-color:var(--ink);box-shadow:0 0 0 3px var(--sunk)}
.tl .when{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.tl .what{font-size:16px;font-weight:600;margin:2px 0 6px}
.tl .body{font-size:14.5px;color:#4A443B;line-height:1.6;max-width:62ch}
.tl .ev:last-child{padding-bottom:6px}
.terminal{border-top:1px solid var(--rule);margin-top:8px;padding-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pill{border-radius:999px;padding:9px 22px;font-size:14.5px;font-weight:600;font-family:var(--serif);white-space:nowrap;flex:none;line-height:1.2}
.pill.no{background:var(--oxblood);color:#fff}
.pill.yes{background:var(--verified);color:#fff}
.terminal .note{font-size:13.5px;color:var(--muted)}
.loop{border-left:2px solid var(--rule);margin:0 0 4px;padding:0 0 4px 22px;position:relative}
.loop:last-child{border-left-color:transparent}
.loop .step{position:absolute;left:-13px;top:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.loop.stop .step{background:var(--oxblood)}
.loop.win .step{background:var(--verified)}
.loop h4{font-size:16px;font-weight:600;margin:2px 0 8px}
.loop .body{padding-bottom:22px}
.constraint{background:var(--ink);color:#F0EDE7;font-family:var(--mono);font-size:13px;line-height:1.6;padding:14px 18px;border-radius:2px}
.constraint b{color:#FFB3A0;font-weight:600}
.diffnote{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.letter ins{background:var(--verified-bg);color:#24512F;text-decoration:none;box-shadow:inset 0 -1px 0 var(--verified)}
.simulated{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--oxblood);border:1px solid var(--oxblood);padding:2px 7px;border-radius:2px;white-space:nowrap}

@media(max-width:860px){
  .spread{flex-direction:column;height:auto}
  .docket{width:100%;max-height:290px}
  .pane{padding:22px 20px 50px}
  .masthead{padding:18px 20px 0}
  .tabs{padding:0 20px;overflow-x:auto}
  .two{grid-template-columns:1fr}
  .two > div:first-child{border-right:0;border-bottom:1px solid var(--rule-soft)}
}
</style>
</head>
<body>

<header class="masthead">
  <h1>Both Sides of the Letter</h1>
  <div class="sub">Dispute response pipeline — every claim checked against the source record <span class="simulated">SIMULATED</span></div>
  <div class="caption" id="caption"></div>
  <div class="reconcile" id="reconcile"></div>
</header>

<div class="spread">
  <nav class="docket" aria-label="Records">
    <div class="docket-head">
      <div class="count" id="count"></div>
      <div class="filters" id="filters"></div>
    </div>
    <div id="list"></div>
  </nav>

  <main class="read">
    <div class="tabs" role="tablist">
      <button class="tb on" data-t="review" role="tab">Review gate</button>
      <button class="tb" data-t="loop" role="tab">Remediation loop</button>
      <button class="tb" data-t="consumer" role="tab">Consumer impact</button>
      <button class="tb" data-t="intent" role="tab">Intent vs impact</button>
      <button class="tb" data-t="validation" role="tab">Validation log</button>
    </div>
    <section class="pane on" id="p-review" role="tabpanel"></section>
    <section class="pane" id="p-loop" role="tabpanel"></section>
    <section class="pane" id="p-consumer" role="tabpanel"></section>
    <section class="pane" id="p-intent" role="tabpanel"></section>
    <section class="pane" id="p-validation" role="tabpanel"></section>
  </main>
</div>

<script>
let DATA=[],SUMMARY={},filt='all',cur=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>{const n=parseFloat(String(v).replace(/[$,]/g,''));return isNaN(n)?String(v||'—'):'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};

const drafted=r=>!!r.draft_letter;
const refused=r=>!!r.remediation_refused;
const flagged=r=>!refused(r)&&((r.review_findings||[]).length>0||r.review_passed===false);
const passed=r=>drafted(r)&&!refused(r)&&!flagged(r)&&!remediated(r);
const remediated=r=>!!(r.original_review_findings&&r.original_review_findings.length);
const recovered=r=>remediated(r)&&!refused(r);
const risky=r=>['high','critical'].includes(String(r.engagement_risk_level||'').toLowerCase());

function caption(){
  const d=DATA.filter(drafted),ref=DATA.filter(refused),hr=DATA.filter(risky);
  const clean=DATA.filter(passed),fixed=DATA.filter(recovered);
  const mins=SUMMARY.elapsed_seconds?Math.round(SUMMARY.elapsed_seconds/60):null;
  const cells=[
    ['Records read',(SUMMARY.total_records||DATA.length).toLocaleString(),'','all','Ingested'],
    ['Letters drafted',(SUMMARY.drafted||d.length).toLocaleString(),'','all','Ingested'],
    ['Cleared first pass',clean.length.toLocaleString(),'ok split','passed','Outcome, 1 of 3'],
    ['Blocked, then fixed',fixed.length.toLocaleString(),'','recovered','Outcome, 2 of 3'],
    ['Refused to send',ref.length.toLocaleString(),'flag','refused','Outcome, 3 of 3'],
    ['Flagged for a human',(hr.length||SUMMARY.high_risk_letters||0).toLocaleString(),'split','risk','Separate score']
  ];
  if(mins)cells.push(['Total run',mins+' min','split',null,'Elapsed']);
  $('#caption').innerHTML=cells.map(function(c){
    const sel=c[3]===filt?' sel':'';
    const inner='<span class="axis">'+c[4]+'</span><span class="n">'+c[1]+'</span><span class="l">'+c[0]+'</span>';
    return c[3]?'<button class="cap '+c[2]+sel+'" data-f="'+c[3]+'">'+inner+'</button>'
               :'<div class="cap '+c[2]+'">'+inner+'</div>';
  }).join('');

  $('#reconcile').innerHTML=
    'Every drafted letter lands in exactly one outcome: <b>'+clean.length+' cleared</b> + <b>'+
    fixed.length+' fixed</b> + <b>'+ref.length+' refused</b> = <b>'+d.length+' letters</b>. '+
    'Consumer risk is scored separately and does not change the outcome, so the <b>'+hr.length+
    ' flagged for a human</b> are already counted inside those three. Click any figure to filter the list.';
}

const FILTERS=[['all','All drafted'],['passed','Cleared first pass'],['recovered','Fixed on re-draft'],
  ['refused','Refused'],['risk','High risk']];
function chips(){
  const m=filterMap();
  $('#filters').innerHTML=FILTERS.map(function(f){
    return '<button class="f'+(filt===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+
      ' <span style="opacity:.6;font-size:11.5px">'+DATA.filter(m[f[0]]).length+'</span></button>';
  }).join('');
}
function filterMap(){
  return {all:drafted,refused:refused,passed:passed,
    remediated:remediated,recovered:recovered,
    risk:function(r){return drafted(r)&&risky(r);}};
}
function visible(){
  const m=filterMap();
  return DATA.filter(m[filt]||m.all);
}

function list(){
  const v=visible();
  const names={all:'All drafted letters',passed:'Cleared the gate on the first pass',
    recovered:'Blocked, then fixed by the model',refused:'Refused, never sent',
    remediated:'Went through remediation',risk:'High consumer risk, any outcome'};
  $('#count').innerHTML='<b>'+v.length.toLocaleString()+'</b> · '+esc(names[filt]||'');
  $('#list').innerHTML=v.slice(0,400).map(function(r){
    let tags='';
    if(refused(r))tags+='<span class="t ref">Refused</span>';
    else if(recovered(r))tags+='<span class="t flagd">Fixed on re-draft</span>';
    else tags+='<span class="t pass">Passed</span>';
    if(risky(r))tags+='<span class="t risk">'+esc(r.engagement_risk_level)+' risk</span>';
    return '<div class="rec'+(r===cur?' on':'')+'" tabindex="0" data-i="'+DATA.indexOf(r)+'">'+
      '<div class="id">'+esc(r.account_id)+'</div>'+
      '<div class="who">'+esc(r.consumer_name||'')+' · '+esc(String(r.classified_type||r.dispute_type||'').replace(/_/g,' '))+'</div>'+
      '<div class="tags">'+tags+'</div></div>';
  }).join('')||'<div class="none" style="padding:26px 18px">No records match this filter.</div>';
}

function markAmounts(text,findings){
  let out=esc(text||'');
  (findings||[]).forEach(function(f){
    if(!f.claim_value)return;
    out=out.split(esc(f.claim_value)).join('<mark>'+esc(f.claim_value)+'</mark>');
  });
  return out;
}

function review(r){
  if(!r)return '<div class="none">Choose a record from the list.</div>';
  const fin=(r.original_review_findings&&r.original_review_findings.length)?r.original_review_findings:(r.review_findings||[]);
  const led=[['Ledger balance',money(r.balance_current)],['Original balance',money(r.balance_original)],
    ['Last payment',r.last_payment_amount?money(r.last_payment_amount):'none recorded'],
    ['State',esc(r.state||'—')],['Dispute type',esc(String(r.classified_type||r.dispute_type||'').replace(/_/g,' '))]];
  let h='<div class="hd first">The source record</div><div class="ledger">'+
    led.map(function(p){return '<div class="ld"><div class="k">'+p[0]+'</div><div class="v">'+p[1]+'</div></div>';}).join('')+'</div>';
  h+='<div class="hd">What the consumer wrote</div><blockquote class="quote">'+esc(r.narrative||'Not provided.')+'</blockquote>';

  if(!r.draft_letter){return h+'<div class="none">No letter was drafted for this record.</div>';}

  h+='<div class="hd">The drafted letter</div><div class="letter">'+markAmounts(r.original_draft_letter||r.draft_letter,fin)+'</div>';

  if(fin.length){
    h+='<div class="hd">What the gate caught</div>'+fin.map(function(f){
      return '<div class="flagnote"><div class="why">'+esc(f.reason||'Unsupported claim')+'</div>'+
        '<div class="meta">'+esc(f.severity||'')+' · '+esc(f.claim_type||'')+' · '+esc(f.claim_value||'')+
        (f.position!=null?' · character '+f.position:'')+'</div></div>';}).join('');
  }

  if(refused(r)){
    h+='<div class="hd">After '+(r.remediation_passes||2)+' attempts</div>'+
      '<div class="verdict refused"><div class="big">Refused. The letter was never sent.</div>'+
      '<div class="fine">The gate handed the model its own finding and asked for a rewrite. The claim survived every attempt, so the system stopped and escalated with the reason recorded.</div></div>';
    if(r.draft_letter&&r.original_draft_letter&&r.draft_letter!==r.original_draft_letter){
      h+='<div class="hd">The rewrite it produced anyway</div><div class="letter">'+markAmounts(r.draft_letter,r.review_findings)+'</div>';
    }
  } else if(fin.length){
    h+='<div class="verdict passed"><div class="big">Corrected on re-draft, then cleared.</div>'+
      '<div class="fine">'+(r.remediation_passes||1)+' pass. Every remaining claim traces to the ledger.</div></div>';
  } else {
    h+='<div class="verdict passed"><div class="big">Cleared the gate.</div>'+
      '<div class="fine">Every factual claim in this letter matches the source record.</div></div>';
  }
  return h;
}

function consumer(r){
  if(!r)return '<div class="none">Choose a record from the list.</div>';
  let h='<div class="hd first">How this reads on the other end</div>';
  h+='<div class="verdict '+(risky(r)?'refused':'passed')+'"><div class="big">Engagement risk: '+esc(r.engagement_risk_level||'not scored')+'</div>'+
    '<div class="fine">Score '+esc(r.engagement_risk_score!=null?r.engagement_risk_score:'—')+'. Phrase matching, not comprehension. This score is not a second opinion on accuracy.</div></div>';
  const ann=r.consumer_annotations||[];
  if(ann.length)h+='<div class="hd">Phrases that carry weight</div><ul class="notes">'+
    ann.map(function(a){return '<li>'+esc(typeof a==='string'?a:(a.text||a.phrase||JSON.stringify(a)))+'</li>';}).join('')+'</ul>';
  if(r.consumer_view)h+='<div class="hd">The consumer\'s position</div><blockquote class="quote">'+esc(r.consumer_view)+'</blockquote>';
  if(!ann.length&&!r.consumer_view)h+='<div class="none">No consumer-side annotations for this record.</div>';
  return h;
}

function intent(r){
  if(!r)return '<div class="none">Choose a record from the list.</div>';
  if(!r.agency_intent&&!r.consumer_impact)return '<div class="none">Intent and impact were not scored for this record.</div>';
  return '<div class="hd first">The same letter, from both ends</div><div class="two">'+
    '<div><div class="k">What the agency meant</div>'+esc(r.agency_intent||'Not recorded.')+'</div>'+
    '<div><div class="k">How it is likely to land</div>'+esc(r.consumer_impact||'Not recorded.')+'</div></div>'+
    '<div class="hd">Why this is a separate reading</div>'+
    '<p>A letter can be completely accurate and still land badly. The review gate checks whether claims are true. It does not check whether the letter answers the dispute.</p>';
}

function validation(r){
  const v=SUMMARY.validation_stats||{};
  let h='<div class="hd first">Data quality across the run</div><div class="dl">'+
    Object.keys(v).map(function(k){
      const val=v[k];
      return '<div><span>'+esc(k.replace(/_/g,' '))+'</span><span>'+esc(typeof val==='object'?JSON.stringify(val):val)+'</span></div>';
    }).join('')+'</div>';
  if(r){
    const rows=[['account_id',r.account_id],['complaint_id',r.complaint_id],['classification method',r.classification_method],
      ['classification confidence',r.classification_confidence],['model tier',r.draft_tier],
      ['validation requested',r.validation_requested],['prior contacts',r.prior_contacts]];
    h+='<div class="hd">This record</div><div class="dl">'+rows.map(function(p){
      return '<div><span>'+esc(p[0])+'</span><span>'+esc(p[1]==null?'—':p[1])+'</span></div>';}).join('')+'</div>';
  }
  return h;
}


function wordDiff(oldT,newT){
  const A=String(oldT||'').split(/(\s+)/),B=String(newT||'').split(/(\s+)/);
  const n=A.length,m=B.length,MAX=900;
  if(n>MAX||m>MAX)return null;
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out='';
  while(i<n&&j<m){
    if(A[i]===B[j]){out+=esc(B[j]);i++;j++;}
    else if(L[i+1][j]>=L[i][j+1]){i++;}
    else {out+='<ins>'+esc(B[j])+'</ins>';j++;}
  }
  while(j<m){out+='<ins>'+esc(B[j])+'</ins>';j++;}
  return out;
}

function markInside(html,findings){
  (findings||[]).forEach(function(f){
    if(!f.claim_value)return;
    html=html.split(esc(f.claim_value)).join('<mark>'+esc(f.claim_value)+'</mark>');
  });
  return html;
}

function diffRows(oldT,newT,fin){
  const A=String(oldT||'').split(/\n/),B=String(newT||'').split(/\n/);
  const setA=new Set(A),setB=new Set(B);
  let out='<div class="diff">';
  A.forEach(function(l){ if(l.trim()&&!setB.has(l)) out+='<div class="row del"><div class="gut">&minus;</div><div class="txt">'+markInside(esc(l),fin)+'</div></div>'; });
  B.forEach(function(l){ if(l.trim()&&!setA.has(l)) out+='<div class="row add"><div class="gut">+</div><div class="txt">'+markInside(esc(l),fin)+'</div></div>'; });
  return out+'</div>';
}

function loop(r){
  if(!r)return '<div class="none">Choose a record from the list.</div>';
  if(!r.draft_letter)return '<div class="none">No letter was drafted for this record.</div>';
  if(!remediated(r)){
    return '<div class="hd first">No remediation needed</div>'+
      '<p>This letter cleared the review gate on its first pass. Every dollar figure and date in it traces to the source record, so it was never handed back to the model.</p>'+
      '<p>Twenty of the three hundred letters in this run did need a second pass. Use <strong>Fixed on re-draft</strong> or <strong>Refused</strong> above to read one.</p>';
  }
  const f0=r.original_review_findings||[], f1=r.review_findings||[];
  const A=r.original_draft_letter||'', B=r.draft_letter||'', won=!refused(r);
  const fnd=f0[0]||{};

  let h='<div class="hd first">Remediation timeline</div>'+
    '<p>The gate does not flag a letter and hand it to a person. It hands the letter back to the model with its own finding attached, then re-checks the result.</p><div class="tl">';

  h+='<div class="ev done"><div class="when">Step 1 &middot; drafted</div><div class="what">The model produced a letter</div>'+
     '<div class="body">'+(f0.length?'It stated '+esc(fnd.claim_value||'a figure')+', taken from the consumer\u2019s assertion rather than the ledger.':'First draft complete.')+'</div></div>';

  h+='<div class="ev stop"><div class="when">Step 2 &middot; blocked</div><div class="what">The gate checked every claim against the ledger</div><div class="body">'+
     f0.map(function(f){return '<div class="flagnote"><div class="why">'+esc(f.reason||'Unsupported claim')+'</div><div class="meta">'+
       esc(f.severity||'')+' &middot; '+esc(f.claim_type||'')+' &middot; '+esc(f.claim_value||'')+(f.position!=null?' &middot; character '+f.position:'')+'</div></div>';}).join('')+
     '</div></div>';

  h+='<div class="ev done"><div class="when">Step 3 &middot; returned</div><div class="what">The finding went back as a constraint</div>'+
     '<div class="body"><div class="constraint">A prior draft was rejected for this reason:<br><b>'+
     esc(fnd.reason||'unsupported claim')+'</b><br>Do not repeat it.</div></div></div>';

  h+='<div class="ev '+(won?'done':'stop')+'"><div class="when">Step 4 &middot; re-drafted</div><div class="what">What the model changed</div><div class="body">'+
     '<div class="suggest"><div class="cap">Removed from the first draft, added on the second</div>'+diffRows(A,B,won?f0:f1)+'</div>'+
     (f1.length?'<p style="margin-top:10px">The unsupported figure survived the rewrite, marked in red.</p>':'<p style="margin-top:10px">The unsupported figure is gone.</p>')+
     '</div></div>';

  h+='<div class="ev '+(won?'done':'stop')+' now"><div class="when">Disposition</div><div class="what">'+
     (won?'Cleared after '+(r.remediation_passes||1)+' pass':'Refused after '+(r.remediation_passes||2)+' passes')+'</div><div class="body">'+
     '<div class="terminal"><span class="pill '+(won?'yes':'no')+'">'+(won?'Sent for review':'Never sent')+'</span>'+
     '<span class="note">'+(won?'Fixed itself. No human needed. Nineteen of twenty blocked letters ended here.':'Not patched, not softened, not sent. Escalated with the reason recorded. One letter in three hundred ended here.')+'</span></div>'+
     '</div></div>';

  return h+'</div>';
}

function render(){
  $('#p-review').innerHTML=review(cur);
  $('#p-loop').innerHTML=loop(cur);
  $('#p-consumer').innerHTML=consumer(cur);
  $('#p-intent').innerHTML=intent(cur);
  $('#p-validation').innerHTML=validation(cur);
}

function setFilter(v){
  filt=v;
  caption();chips();list();
}
document.addEventListener('click',function(e){
  const cap=e.target.closest('.cap[data-f]');
  if(cap){setFilter(cap.dataset.f);return;}
  const f=e.target.closest('.f');
  if(f){setFilter(f.dataset.f);return;}
  const t=e.target.closest('.tb');
  if(t){document.querySelectorAll('.tb').forEach(function(b){b.classList.toggle('on',b===t);});
    document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+t.dataset.t);});return;}
  const rec=e.target.closest('.rec');
  if(rec){cur=DATA[+rec.dataset.i];list();render();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('rec')){cur=DATA[+e.target.dataset.i];list();render();}
});

(function(){
  DATA=window.__PIPELINE_RECORDS||[];
  SUMMARY=window.__PIPELINE_SUMMARY||{};
  cur=DATA.filter(refused)[0]||DATA.filter(flagged)[0]||DATA.filter(drafted)[0]||DATA[0]||null;
  caption();chips();list();render();
})();
</script>
